name: Publish IDIOTS! Godot alpha.5 browser playtest
on:
  workflow_dispatch:
  push:
    branches: [godot/alpha-5-feel-restoration]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  export-and-deploy:
    environment:
      name: alpha-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import Godot project
        run: godot --headless --path . --editor --import --quit
      - name: Smoke-test main scene and GDScript
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 120 2>&1 | tee godot-smoke.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid access to property|Invalid call\.)' godot-smoke.log; then
            echo "Godot reported script or runtime errors. Failing deployment."
            exit 1
          fi
      - name: Export HTML5 build
        run: |
          mkdir -p dist
          godot --headless --path . --export-release Web dist/index.html
          test -s dist/index.html
          test -n "$(find dist -maxdepth 1 -name '*.wasm' -print -quit)"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload web export
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy web export
        id: deployment
        uses: actions/deploy-pages@v4
